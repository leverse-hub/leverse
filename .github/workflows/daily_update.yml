              };

              fs.writeFileSync("data.json", JSON.stringify(liveData, null, 2));
              console.log("Live sports data successfully updated.");
          }

          fetchLiveSportsData();
          '

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Live API sync: update sports rankings [skip ci]" || exit 0
          git push
