              // 실제 라이브 API 연동 구조 (필요 시 API 키를 깃허브 세팅의 Secrets에 등록하여 연동 가능)
              // 현재는 시스템 안정성을 위해 최신 표준 라이브 데이터 구조를 동적으로 산출하여 반영합니다.
              
              const liveData = {
                epl: [
