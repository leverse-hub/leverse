name: Daily Live Sports Data Auto Update

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  update-live-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch Live Sports Data & Update JSON
