<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVERSE - 실시간 배너 광고 관리자</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0b0d12; 
            color: #ffffff; 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            margin: 0; 
            padding: 30px 20px; 
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; display: none; } /* 비밀번호 인증 전까지 숨김 */
        h1 { color: #ffd700; text-align: center; margin-bottom: 30px; font-size: 24px; }
        
        .card { 
            background: #121722; 
            border: 1px solid rgba(255, 215, 0, 0.25); 
            border-radius: 8px; 
            padding: 25px; 
            margin-bottom: 25px; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }
        .card h3 { color: #ffd700; margin-top: 0; margin-bottom: 20px; font-size: 16px; border-bottom: 1px solid rgba(255,215,0,0.1); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #8a99ad; font-size: 13px; margin-bottom: 6px; }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            background: #0b0d12; 
            border: 1px solid rgba(255,215,0,0.2); 
            border-radius: 5px; 
            color: #fff; 
            font-size: 14px; 
        }
        input[type="text"]:focus { border-color: #ffd700; outline: none; }
        
        .btn { 
            background: linear-gradient(135deg, #e6c547, #b8860b); 
            color: #111; 
            padding: 12px 20px; 
            border: none;
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 14px; 
            cursor: pointer; 
            transition: all 0.3s;
        }
        .btn:hover { background: linear-gradient(135deg, #ffd700, #daa520); }
        .btn-danger { background: #e74c3c; color: white; padding: 6px 12px; font-size: 12px; }
        .btn-danger:hover { background: #c0392b; }

        .banner-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #0b0d12; 
            padding: 12px 15px; 
            border-radius: 5px; 
            margin-bottom: 10px; 
            border: 1px solid rgba(255,215,0,0.1);
        }
        .banner-info { font-size: 13px; color: #fff; }
        .banner-info span { color: #8a99ad; display: block; font-size: 11px; margin-top: 3px; }
        
        #status-msg { margin-top: 10px; font-size: 13px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="container" id="adminContainer">
        <h1>👑 LEVERSE 실시간 배너 광고 관리자</h1>

        <div class="card">
            <h3>⚙️ 연동 설정 (최초 1회 저장)</h3>
            <div class="form-group">
                <label>JSONBin Master Key</label>
                <input type="text" id="masterKey" value="$2a$10$z02BCvLiUiJxAdGwNLshJeQHmEmBK0dRsCnGRF.xsuMwIAFFqO2dW">
            </div>
            <div class="form-group">
                <label>Bin ID (데이터 보관함 ID)</label>
                <input type="text" id="binId" placeholder="아래 [새 빈 자동 생성하기]를 누르세요">
            </div>
            <button class="btn" onclick="saveConfig()">설정 저장하기</button>
            <button class="btn" style="background:#2ecc71; color:#111; margin-left:10px;" onclick="createNewBin()">새 빈(Bin) 자동 생성하기</button>
        </div>

        <div class="card">
            <h3>➕ 새 배너 추가</h3>
            <div class="form-group">
                <label>광고주 / 배너 제목</label>
                <input type="text" id="title" placeholder="예: 신규가입 3만원 이벤트">
            </div>
            <div class="form-group">
                <label>배너 이미지 주소 (URL)</label>
                <input type="text" id="imageUrl" placeholder="https://domain.com/banner.gif">
            </div>
            <div class="form-group">
                <label>클릭 시 이동할 링크 주소 (URL)</label>
                <input type="text" id="linkUrl" placeholder="https://t.me/...">
            </div>
            <button class="btn" onclick="addBanner()">배너 등록 및 실시간 반영</button>
            <div id="status-msg"></div>
        </div>

        <div class="card">
            <h3>📋 현재 등록된 배너 목록</h3>
            <div id="bannerList">설정을 완료하면 목록이 불러와집니다.</div>
        </div>
    </div>

    <script>
        // 관리자 접속 비밀번호 확인
        const password = prompt("관리자 비밀번호를 입력하세요:");
        if (password !== "5711") {
            alert("비밀번호가 틀렸습니다. 접근이 거부됩니다.");
            document.body.innerHTML = "<h2 style='color:red; text-align:center; margin-top:20vh;'>ACCESS DENIED</h2>";
        } else {
            document.getElementById('adminContainer').style.display = 'block';
        }

        document.getElementById('masterKey').value = "$2a$10$z02BCvLiUiJxAdGwNLshJeQHmEmBK0dRsCnGRF.xsuMwIAFFqO2dW";
        document.getElementById('binId').value = localStorage.getItem('jsonbin_bin_id') || '';

        let banners = [];

        function saveConfig() {
            const key = document.getElementById('masterKey').value.trim();
            const id = document.getElementById('binId').value.trim();
            localStorage.setItem('jsonbin_master_key', key);
            localStorage.setItem('jsonbin_bin_id', id);
            alert('설정이 저장되었습니다!');
            loadBanners();
        }

        async function createNewBin() {
            const key = document.getElementById('masterKey').value.trim();
            if (!key) { alert('Master Key를 입력해주세요!'); return; }
            try {
                const res = await fetch('https://api.jsonbin.io/v3/b', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': key,
                        'X-Bin-Name': 'LeverseBanners'
                    },
                    body: JSON.stringify([
                        { title: "초기 배너", imageUrl: "https://via.placeholder.com/1200x320", linkUrl: "https://t.me" }
                    ])
                });
                const data = await res.json();
                if (data.metadata && data.metadata.id) {
                    document.getElementById('binId').value = data.metadata.id;
                    localStorage.setItem('jsonbin_bin_id', data.metadata.id);
                    alert('새 빈(Bin)이 생성되었습니다! 상단의 [설정 저장하기]를 꼭 눌러주세요.');
                    loadBanners();
                } else {
                    alert('생성 실패: ' + JSON.stringify(data));
                }
            } catch (e) {
                alert('오류 발생: ' + e.message);
            }
        }

            const key = document.getElementById('masterKey').value.trim();
            const id = localStorage.getItem('jsonbin_bin
