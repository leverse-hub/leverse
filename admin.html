<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVERSE - 관리자 센터</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #08090c; color: #ffffff; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; margin: 0; padding: 30px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #ffd700; font-size: 24px; margin-bottom: 20px; }
        .card { background: #11151e; border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #8a99ad; font-size: 13px; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; background: #08090c; border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 14px; }
        input:focus { border-color: #ffd700; outline: none; }
        .btn { background: linear-gradient(135deg, #ffd700, #b8860b); color: #111; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-reset { background: #e74c3c; color: white; padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #e74c3c; color: white; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }
        .banner-item { display: flex; justify-content: space-between; align-items: center; background: #181f2c; padding: 12px 15px; border-radius: 6px; margin-bottom: 10px; border: 1px solid rgba(255, 215, 0, 0.1); }
        .msg { margin-top: 10px; font-size: 13px; color: #2ecc71; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #08090c; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: #11151e; border: 1px solid rgba(255, 215, 0, 0.4); border-radius: 12px; padding: 30px; width: 350px; text-align: center; }
        .login-box h2 { color: #ffd700; margin-top: 0; font-size: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔒 LEVERSE ADMIN</h2>
            <div class="form-group" style="text-align: left;">
                <label>관리자 비밀번호</label>
                <input type="password" id="adminPassword" placeholder="비밀번호를 입력하세요" onkeydown="if(event.key==='Enter') checkLogin()">
            </div>
            <button class="btn" style="width: 100%; margin-top: 10px;" onclick="checkLogin()">로그인</button>
            <div id="loginMsg" style="color: #e74c3c; font-size: 12px; margin-top: 10px;"></div>
        </div>
    </div>

    <div class="container" id="adminMainContent" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>LEVERSE OFFICIAL 관리자 센터</h1>
            <button class="btn-danger" onclick="logout()">로그아웃</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0; color:#ffd700; font-size:16px;">+ 새 배너 추가</h3>
            <div class="form-group">
                <label>광고주 / 배너 제목</label>
                <input type="text" id="title" placeholder="예: 신규가입 이벤트">
            </div>
            <div class="form-group">
                <label>배너 이미지 주소 (URL)</label>
                <input type="text" id="imageUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>클릭 시 이동할 링크 주소 (URL)</label>
                <input type="text" id="linkUrl" placeholder="https://t.me/...">
            </div>
            <button class="btn" id="submitBtn" onclick="addBanner()">배너 등록 및 즉시 반영</button>
            <div id="statusMsg" class="msg"></div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="margin:0; color:#ffd700; font-size:16px;">📋 현재 등록된 배너 목록</h3>
                <button class="btn-reset" onclick="resetDB()">전체 초기화</button>
            </div>
            <div id="bannerList">불러오는 중...</div>
        </div>
    </div>

    <script>
        const ADMIN_PW = "5711"; 
        let currentBanners = [];

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('leverse_admin_auth') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminMainContent').style.display = 'block';
                loadBanners();
            }
        });

        function checkLogin() {
            if (document.getElementById('adminPassword').value === ADMIN_PW) {
                sessionStorage.setItem('leverse_admin_auth', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminMainContent').style.display = 'block';
                loadBanners();
            } else {
                document.getElementById('loginMsg').textContent = '비밀번호가 틀렸습니다.';
            }
        }

        function logout() {
            sessionStorage.removeItem('leverse_admin_auth');
            location.reload(); 
        }

        async function loadBanners() {
            try {
                const res = await fetch('./banners.json?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    currentBanners = Array.isArray(data) ? data : (data.banners || []);
                }
            } catch (e) {
                currentBanners = [];
            }
            renderAdminList();
        }

        function renderAdminList() {
            const listEl = document.getElementById('bannerList');
            if (currentBanners.length === 0) {
                listEl.innerHTML = '<span style="color:#8a99ad;">등록된 배너가 없습니다. 새 배너를 등록해주세요.</span>';
                return;
            }
            let html = '';
            currentBanners.forEach((b, index) => {
                html += `
                    <div class="banner-item">
                        <div>
                            <strong style="color:#fff;">${b.title || '제목 없음'}</strong><br>
                            <span style="color:#7a8b9e; font-size:11px;">링크: ${b.linkUrl || '#'}</span>
                        </div>
                        <button class="btn-danger" onclick="deleteBanner(${index})">삭제</button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        async function addBanner() {
            const title = document.getElementById('title').value.trim();
            const imageUrl = document.getElementById('imageUrl').value.trim();
            const linkUrl = document.getElementById('linkUrl').value.trim();

            if (!imageUrl) {
                alert('배너 이미지 주소를 입력해주세요.');
                return;
            }

            currentBanners.push({
                title: title || '제목 없음',
                imageUrl: imageUrl,
                linkUrl: linkUrl || '#'
            });

            saveAndDownload();
        }

        function deleteBanner(index) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            currentBanners.splice(index, 1);
            saveAndDownload();
        }

        function resetDB() {
            if (!confirm('정말 초기화하시겠습니까?')) return;
            currentBanners = [];
            saveAndDownload();
        }

        function saveAndDownload() {
            // JSON 파일을 자동으로 다운로드하게 만들어 깃허브에 업로드하기 가장 쉽게 처리
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ banners: currentBanners }, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "banners.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            renderAdminList();
            
            const msgEl = document.getElementById('statusMsg');
            msgEl.textContent = '배너가 저장되었습니다! 다운로드된 banners.json 파일을 깃허브에 업로드(Commit)해주세요.';
            
            document.getElementById('title').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('linkUrl').value = '';
        }
    </script>
</body>
</html>
