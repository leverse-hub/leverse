<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVERSE - 관리자 센터</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0b0d12; 
            color: #ffffff; 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            margin: 0; 
            padding: 30px 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wrapper { width: 100%; max-width: 800px; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        h1 { color: #ffd700; margin: 0; font-size: 22px; }
        
        .card { 
            background: #121722; 
            border: 1px solid rgba(255, 215, 0, 0.25); 
            border-radius: 8px; 
            padding: 25px; 
            margin-bottom: 25px; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }
        .card h3 { color: #ffd700; margin-top: 0; margin-bottom: 20px; font-size: 16px; border-bottom: 1px solid rgba(255,215,0,0.1); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #8a99ad; font-size: 13px; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            background: #0b0d12; 
            border: 1px solid rgba(255,215,0,0.2); 
            border-radius: 5px; 
            color: #fff; 
            font-size: 14px; 
        }
        input:focus { border-color: #ffd700; outline: none; }
        
        .btn { 
            background: linear-gradient(135deg, #e6c547, #b8860b); 
            color: #111; 
            padding: 12px 20px; 
            border: none;
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 14px; 
            cursor: pointer; 
            transition: all 0.3s;
        }
        .btn:hover { background: linear-gradient(135deg, #ffd700, #daa520); }
        .btn-danger { background: #e74c3c; color: white; padding: 6px 12px; font-size: 12px; }
        .btn-danger:hover { background: #c0392b; }
        .btn-logout { background: #34495e; color: #fff; padding: 8px 15px; font-size: 13px; }
        .btn-logout:hover { background: #2c3e50; }

        .banner-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #0b0d12; 
            padding: 12px 15px; 
            border-radius: 5px; 
            margin-bottom: 10px; 
            border: 1px solid rgba(255,215,0,0.1);
        }
        .banner-info { font-size: 13px; color: #fff; }
        .banner-info span { color: #8a99ad; display: block; font-size: 11px; margin-top: 3px; }
        
        #status-msg { margin-top: 10px; font-size: 13px; font-weight: bold; text-align: center; }
        
        #loginBox { text-align: center; max-width: 400px; margin: 0 auto; display: block; }
        #adminContent { display: none; }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- 로그인 화면 -->
        <div class="card" id="loginBox">
            <h3>🔒 관리자 인증</h3>
            <div class="form-group" style="text-align: left;">
                <label>관리자 비밀번호를 입력하세요</label>
                <input type="password" id="loginPw" placeholder="비밀번호 입력">
            </div>
            <button class="btn" style="width:100%;" onclick="tryLogin()">로그인</button>
        </div>

        <!-- 실제 관리자 패널 -->
        <div id="adminContent">
            <div class="header-bar">
                <h1>👑 LEVERSE 실시간 배너 관리자</h1>
                <button class="btn btn-logout" onclick="logout()">🔒 로그아웃</button>
            </div>

            <div class="card">
                <h3>⚙️ 연동 설정</h3>
                <div class="form-group">
                    <label>JSONBin Master Key</label>
                    <input type="text" id="masterKey" value="$2a$10$z02BCvLiUiJxAdGwNLshJeQHmEmBK0dRsCnGRF.xsuMwIAFFqO2dW">
                </div>
                <div class="form-group">
                    <label>Bin ID (데이터 보관함 ID)</label>
                    <input type="text" id="binId" value="6af2586bffd5d16053b5085a">
                </div>
                <button class="btn" onclick="saveConfig()">설정 저장하기</button>
            </div>

            <div class="card">
                <h3>➕ 새 배너 추가</h3>
                <div class="form-group">
                    <label>광고주 / 배너 제목</label>
                    <input type="text" id="title" placeholder="예: 신규가입 이벤트">
                </div>
                <div class="form-group">
                    <label>배너 이미지 주소 (URL)</label>
                    <input type="text" id="imageUrl" placeholder="https://domain.com/banner.gif">
                </div>
                <div class="form-group">
                    <label>클릭 시 이동할 링크 주소 (URL)</label>
                    <input type="text" id="linkUrl" placeholder="https://t.me/...">
                </div>
                <button class="btn" onclick="addBanner()">배너 등록 및 실시간 반영</button>
                <div id="status-msg"></div>
            </div>

            <div class="card">
                <h3>📋 현재 등록된 배너 목록</h3>
                <div id="bannerList">목록을 불러오는 중...</div>
            </div>
        </div>
    </div>

    <script>
        // 페이지 로드 시 로그인 상태 확인
        window.onload = function() {
            if (sessionStorage.getItem('is_admin') === 'true') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadBanners();
            }
        };

        function tryLogin() {
            const pwInput = document.getElementById('loginPw').value;
            if (pwInput === '5711') {
                sessionStorage.setItem('is_admin', 'true');
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadBanners();
            } else {
                alert('비밀번호가 틀렸습니다!');
                document.getElementById('loginPw').value = '';
            }
        }

        function logout() {
            sessionStorage.removeItem('is_admin');
            document.getElementById('adminContent').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('loginPw').value = '';
        }

        function saveConfig() {
            alert('설정이 저장되었습니다!');
            loadBanners();
        }

        let banners = [];

        async function loadBanners() {
            const key = document.getElementById('masterKey').value.trim();
            const id = document.getElementById('binId').value.trim();

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`, {
                    headers: { 'X-Master-Key': key }
                });
                const data = await res.json();
                banners = data.record || [];
                renderList();
            } catch (e) {
                console.error('불러오기 실패', e);
            }
        }

        async function saveToCloud() {
            const key = document.getElementById('masterKey').value.trim();
            const id = document.getElementById('binId').value.trim();
            const msg = document.getElementById('status-msg');

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': key
                    },
                    body: JSON.stringify(banners)
                });
                if (res.ok) {
                    msg.style.color = '#2ecc71';
                    msg.innerText = '✨ 성공적으로 실시간 반영되었습니다!';
                    renderList();
                } else {
                    msg.style.color = '#e74c3c';
                    msg.innerText = '❌ 저장 실패';
                }
            } catch (e) {
                msg.style.color = '#e74c3c';
                msg.innerText = '❌ 오류: ' + e.message;
            }
        }

        function addBanner() {
            const title = document.getElementById('title').value.trim();
            const imageUrl = document.getElementById('imageUrl').value.trim();
            const linkUrl = document.getElementById('linkUrl').value.trim();

            if (!title || !imageUrl || !linkUrl) {
                alert('모든 항목을 입력해주세요!');
                return;
            }

            banners.push({ title, imageUrl, linkUrl });
            saveToCloud();

            document.getElementById('title').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('linkUrl').value = '';
