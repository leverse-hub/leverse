<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVERSE</title>
    <style>
        body { background-color: #0b0d12; color: #fff; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #ffd700; margin-bottom: 20px; }
        .banner-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .banner-card { 
            background: #121722; 
            border: 1px solid rgba(255, 215, 0, 0.3); 
            border-radius: 8px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .banner-card:hover { transform: translateY(-3px); border-color: #ffd700; }
        .banner-card img { width: 100%; height: auto; display: block; max-height: 350px; object-fit: cover; }
        .banner-title { padding: 12px; font-size: 16px; font-weight: bold; color: #ffd700; background: #0f131c; border-top: 1px solid rgba(255,215,0,0.1); }
        .no-banner { color: #8a99ad; padding: 40px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>LEVERSE</h1>
    <div class="banner-container" id="mainBannerList">
        <div class="no-banner">배너를 불러오는 중...</div>
    </div>

    <script>
        const MASTER_KEY = "$2a$10$z02BCvLiUiJxAdGwNLshJeQHmEmBK0dRsCnGRF.xsuMwIAFFqO2dW";
        const BIN_ID = "6af2586bffd5d16053b5085a";

        async function loadMainBanners() {
            const container = document.getElementById('mainBannerList');
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                const banners = data.record || [];

                if (banners.length === 0) {
                    container.innerHTML = '<div class="no-banner">등록된 배너가 없습니다.</div>';
                    return;
                }

                let html = '';
                banners.forEach(b => {
                    html += `
                        <div class="banner-card" onclick="window.open('${b.linkUrl}', '_blank')">
                            <img src="${b.imageUrl}" alt="${b.title}" onerror="this.src='https://via.placeholder.com/1200x300?text=Image+Load+Error'">
                            <div class="banner-title">${b.title}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div class="no-banner">배너를 불러오지 못했습니다.</div>';
            }
        }

        loadMainBanners();
    </script>
</body>
</html>
