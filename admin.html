<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVERSE - 관리자 센터</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #08090c; color: #ffffff; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; margin: 0; padding: 30px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #ffd700; font-size: 24px; margin-bottom: 20px; }
        .card { background: #11151e; border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #8a99ad; font-size: 13px; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; background: #08090c; border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 14px; }
        input:focus { border-color: #ffd700; outline: none; }
        .btn { background: linear-gradient(135deg, #ffd700, #b8860b); color: #111; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        .btn-reset { background: #e74c3c; color: white; padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #e74c3c; color: white; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }
        .banner-item { display: flex; justify-content: space-between; align-items: center; background: #181f2c; padding: 12px 15px; border-radius: 6px; margin-bottom: 10px; border: 1px solid rgba(255, 215, 0, 0.1); }
        .msg { margin-top: 10px; font-size: 13px; color: #2ecc71; }
        
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #08090c; display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box {
            background: #11151e; border: 1px solid rgba(255, 215, 0, 0.4); border-radius: 12px; padding: 30px; width: 350px; text-align: center;
        }
        .login-box h2 { color: #ffd700; margin-top: 0; font-size: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- 관리자 로그인 화면 -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔒 LEVERSE ADMIN</h2>
            <div class="form-group" style="text-align: left;">
                <label>관리자 비밀번호</label>
                <input type="password" id="adminPassword" placeholder="비밀번호를 입력하세요" onkeydown="if(event.key==='Enter') checkLogin()">
            </div>
            <button class="btn" style="width: 100%; margin-top: 10px;" onclick="checkLogin()">로그인</button>
            <div id="loginMsg" style="color: #e74c3c; font-size: 12px; margin-top: 10px;"></div>
        </div>
    </div>

    <!-- 메인 관리자 패널 -->
    <div class="container" id="adminMainContent" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>LEVERSE OFFICIAL 관리자 센터</h1>
            <button class="btn-danger" onclick="logout()">로그아웃</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0; color:#ffd700; font-size:16px;">+ 새 배너 추가</h3>
            <div class="form-group">
                <label>광고주 / 배너 제목</label>
                <input type="text" id="title" placeholder="예: 신규가입 이벤트">
            </div>
            <div class="form-group">
                <label>배너 이미지 주소 (URL)</label>
                <input type="text" id="imageUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>클릭 시 이동할 링크 주소 (URL)</label>
                <input type="text" id="linkUrl" placeholder="https://t.me/...">
            </div>
            <button class="btn" id="submitBtn" onclick="addBanner()">배너 등록 및 실시간 반영</button>
            <div id="statusMsg" class="msg"></div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="margin:0; color:#ffd700; font-size:16px;">📋 현재 등록된 배너 목록</h3>
                <button class="btn-reset" onclick="resetDB()">초기화 및 새로고침</button>
            </div>
            <div id="bannerList">불러오는 중...</div>
        </div>
    </div>

    <script>
        const ADMIN_PW = "5711"; 
        // 🔒 렌더 프록시 서버 주소로 완벽하게 연결 완료
        const API_BASE_URL = "https://leverse.onrender.com";
        let currentBanners = [];

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('leverse_admin_auth') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminMainContent').style.display = 'block';
                loadBanners();
            }
        });

        function checkLogin() {
            const inputPw = document.getElementById('adminPassword').value;
            const msgEl = document.getElementById('loginMsg');

            if (inputPw === ADMIN_PW) {
                sessionStorage.setItem('leverse_admin_auth', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminMainContent').style.display = 'block';
                loadBanners();
            } else {
                msgEl.textContent = '비밀번호가 틀렸습니다.';
            }
        }

        function logout() {
            sessionStorage.removeItem('leverse_admin_auth');
            location.reload(); 
        }

        // 🔒 백엔드 프록시 서버를 통해 안전하게 배너 목록 로드
        async function loadBanners() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/banners`);
                if (!res.ok) throw new Error('서버 통신 실패');
                const data = await res.json();
                
                let raw = data.record;
                if (raw && Array.isArray(raw.banners)) {
                    currentBanners = raw.banners;
                } else if (Array.isArray(raw)) {
                    currentBanners = raw;
                } else {
                    currentBanners = [];
                }
                renderAdminList();
            } catch (e) {
                console.error(e);
                currentBanners = [];
                renderAdminList();
            }
        }

        function renderAdminList() {
            const listEl = document.getElementById('bannerList');
            if (currentBanners.length === 0) {
                listEl.innerHTML = '<span style="color:#8a99ad;">등록된 배너가 없습니다. 새 배너를 등록해주세요.</span>';
                return;
            }

            let html = '';
            currentBanners.forEach((b, index) => {
                html += `
                    <div class="banner-item">
                        <div>
                            <strong style="color:#fff;">${b.title || '제목 없음'}</strong><br>
                            <span style="color:#7a8b9e; font-size:11px;">링크: ${b.linkUrl || '#'}</span>
                        </div>
                        <button class="btn-danger" onclick="deleteBanner(${index})">삭제</button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        async function addBanner() {
            const title = document.getElementById('title').value.trim();
            const imageUrl = document.getElementById('imageUrl').value.trim();
            const linkUrl = document.getElementById('linkUrl').value.trim();

            if (!imageUrl) {
                alert('배너 이미지 주소를 입력해주세요.');
                return;
            }

            currentBanners.push({
                title: title || '제목 없음',
                imageUrl: imageUrl,
                linkUrl: linkUrl || '#'
            });

            await saveToCloud();
            document.getElementById('title').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('linkUrl').value = '';
        }

        async function deleteBanner(index) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            currentBanners.splice(index, 1);
            await saveToCloud();
        }

        async function resetDB() {
            if (!confirm('정말 모든 데이터를 초기화하시겠습니까?')) return;
            currentBanners = [];
            await saveToCloud();
            alert('데이터베이스가 초기화되었습니다.');
        }

        // 🔒 백엔드 프록시 서버를 통해 안전하게 클라우드 저장
        async function saveToCloud() {
            const msgEl = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitBtn');

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = '저장 및 반영 중...';
            }

            try {
                const res = await fetch(`${API_BASE_URL}/api/banners`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ banners: currentBanners })
                });

                const result = await res.json();

                if (res.ok && result.success) {
                    msgEl.textContent = '성공적으로 저장 및 반영되었습니다!';
                    renderAdminList();
                    setTimeout(() => { msgEl.textContent = ''; }, 3000);
                } else {
                    alert('저장 실패: ' + (result.message || '알 수 없는 오류'));
                }
            } catch (e) {
                console.error(e);
                alert('저장 중 네트워크 오류 발생');
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '배너 등록 및 실시간 반영';
                }
            }
        }
    </script>
</body>
</html>
