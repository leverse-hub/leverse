<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVERSE - 관리자 센터</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #08090c; 
            color: #ffffff; 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            margin: 0; 
            padding: 30px 20px; 
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #ffd700; font-size: 24px; margin-bottom: 20px; }
        .card {
            background: #11151e;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #8a99ad; font-size: 13px; margin-bottom: 6px; }
        input[type="text"] {
            width: 100%;
            background: #08090c;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 6px;
            padding: 10px 12px;
            color: #fff;
            font-size: 14px;
        }
        input[type="text"]:focus {
            border-color: #ffd700;
            outline: none;
        }
        .btn {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #111;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-danger {
            background: #e74c3c;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }
        .banner-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181f2c;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        .msg { margin-top: 10px; font-size: 13px; color: #2ecc71; }
    </style>
</head>
<body>
    <div class="container">
        <h1>LEVERSE OFFICIAL 관리자 센터</h1>

        <!-- 설정 카드 -->
        <div class="card">
            <h3 style="margin-top:0; color:#ffd700; font-size:16px;">데이터베이스 설정</h3>
            <div class="form-group">
                <label>JSONBin Master Key</label>
                <input type="text" id="masterKey" value="$2a$10$z02BCvLiUiJxAdGwNLshJeQHmEmBK0dRsCnGRF.xsuMwIAFFqO2dW">
            </div>
            <div class="form-group">
                <label>Bin ID</label>
                <input type="text" id="binId" value="6af2586bffd5d16053b5085a">
            </div>
            <button class="btn" onclick="saveConfig()">설정 저장</button>
        </div>

        <!-- 배너 추가 카드 -->
        <div class="card">
            <h3 style="margin-top:0; color:#ffd700; font-size:16px;">+ 새 배너 추가</h3>
            <div class="form-group">
                <label>광고주 / 배너 제목</label>
                <input type="text" id="title" placeholder="예: 신규가입 이벤트">
            </div>
            <div class="form-group">
                <label>배너 이미지 주소 (URL)</label>
                <input type="text" id="imageUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>클릭 시 이동할 링크 주소 (URL)</label>
                <input type="text" id="linkUrl" placeholder="https://t.me/...">
            </div>
            <button class="btn" onclick="addBanner()">배너 등록 및 실시간 반영</button>
            <div id="statusMsg" class="msg"></div>
        </div>

        <!-- 등록된 배너 목록 -->
        <div class="card">
            <h3 style="margin-top:0; color:#ffd700; font-size:16px;">📋 현재 등록된 배너 목록</h3>
            <div id="bannerList">불러오는 중...</div>
        </div>
    </div>

    <script>
        let currentBanners = [];

        function getConfig() {
            return {
                masterKey: document.getElementById('masterKey').value.trim(),
                binId: document.getElementById('binId').value.trim()
            };
        }

        function saveConfig() {
            alert('설정이 저장되었습니다!');
            loadBanners();
        }

        async function loadBanners() {
            const { masterKey, binId } = getConfig();
            const listEl = document.getElementById('bannerList');
            
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: { 'X-Master-Key': masterKey }
                });
                const data = await res.json();
                console.log("불러온 원본 데이터:", data); // F12 콘솔에서 구조 확인용

                // 데이터 구조 유연하게 추출
                let raw = data.record ? (data.record.record || data.record) : data;
                if (raw && Array.isArray(raw.banners)) {
                    currentBanners = raw.banners;
                } else if (Array.isArray(raw)) {
                    currentBanners = raw;
                } else {
                    currentBanners = [];
                }

                renderAdminList();
            } catch (e) {
                console.error(e);
                listEl.innerHTML = '<span style="color:#e74c3c;">데이터를 불러오는 중 오류가 발생했습니다.</span>';
            }
        }

        function renderAdminList() {
            const listEl = document.getElementById('bannerList');
            if (currentBanners.length === 0) {
                listEl.innerHTML = '<span style="color:#8a99ad;">등록된 배너가 없습니다.</span>';
                return;
            }

            let html = '';
            currentBanners.forEach((b, index) => {
                html += `
                    <div class="banner-item">
                        <div>
                            <strong style="color:#fff;">${b.title || '제목 없음'}</strong><br>
                            <span style="color:#7a8b9e; font-size:11px;">링크: ${b.linkUrl || b.link || ''}</span>
                        </div>
                        <button class="btn-danger" onclick="deleteBanner(${index})">삭제</button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        async function addBanner() {
            const title = document.getElementById('title').value.trim();
            const imageUrl = document.getElementById('imageUrl').value.trim();
            const linkUrl = document.getElementById('linkUrl').value.trim();

            if (!imageUrl) {
                alert('배너 이미지 주소를 입력해주세요.');
                return;
            }

            currentBanners.push({
                title: title || '제목 없음',
                imageUrl: imageUrl,
                linkUrl: linkUrl || '#'
            });

            await saveToCloud();
        }

        async function deleteBanner(index) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            currentBanners.splice(index, 1);
            await saveToCloud();
        }

        async function saveToCloud() {
            const { masterKey, binId } = getConfig();
            const msgEl = document.getElementById('statusMsg');

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': masterKey
                    },
                    body: JSON.stringify(currentBanners)
                });

                if (res.ok) {
                    msgEl.textContent = '성공적으로 실시간 반영되었습니다!';
                    renderAdminList();
                    setTimeout(() => { msgEl.textContent = ''; }, 3000);
                } else {
                    alert('저장 실패');
                }
            } catch (e) {
                console.error(e);
                alert('저장 중 오류 발생');
            }
        }

        window.addEventListener('DOMContentLoaded', loadBanners);
    </script>
</body>
</html>
