<!DOCTYPE html>
<html lang="ko">
<head>

    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #1a1a24;
            --gold-primary: #f3ba2f;
            --gold-gradient: linear-gradient(135deg, #ffe082 0%, #f3ba2f 100%);
            --text-color: #ffffff;
            --text-dim: #a0a0b0;
            --accent-red: #ff4757;
            --live-green: #2ed573;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding-bottom: 50px; }

        header {
            background: #14141c; border-bottom: 1px solid #2a2a3a;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.3rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-header { background: var(--gold-gradient); color: #000; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .hero-banner {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1639762681485-074b7f938ba0?auto=format&fit=crop&w=1000&q=80');
            background-size: cover; background-position: center; border: 2px solid var(--gold-primary);
            border-radius: 12px; padding: 35px 20px; text-align: center; margin-bottom: 25px;
        }
        .hero-badge { display: inline-block; background: var(--accent-red); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 12px; }
        .hero-title { font-size: 1.8rem; margin-bottom: 10px; }
        .hero-desc { color: var(--text-dim); margin-bottom: 20px; font-size: 1rem; }
        .btn-main { display: inline-block; background: var(--gold-gradient); color: #000; padding: 14px 30px; border-radius: 30px; font-size: 1.1rem; font-weight: 800; text-decoration: none; }

        .section-title { font-size: 1.2rem; margin: 25px 0 15px 0; border-left: 4px solid var(--gold-primary); padding-left: 10px; }

        .banner-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .banner-card { background: var(--card-bg); border: 1px solid #2a2a3a; border-radius: 10px; padding: 18px; text-decoration: none; color: white; display: flex; flex-direction: column; justify-content: space-between; }
        .banner-card:hover { border-color: var(--gold-primary); }
        .card-tag { color: var(--gold-primary); font-size: 0.8rem; font-weight: bold; margin-bottom: 6px; }
        .card-title { font-size: 1.05rem; font-weight: bold; margin-bottom: 6px; }
        .card-sub { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px; }
        .card-btn { background: #2a2a3a; text-align: center; padding: 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; color: var(--gold-primary); }

        /* 라이브스코어 전광판 사이드바 CSS */
        .sidebar-box {
            background: linear-gradient(180deg, #181824 0%, #101018 100%);
            border: 2px solid #333348;
            border-radius: 14px;
            padding: 18px;
            height: fit-content;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .sidebar-header {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--gold-primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #2a2a3a;
            padding-bottom: 12px;
        }

        .live-tag {
            background: var(--accent-red);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            animation: pulse-glow 1.2s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 5px rgba(255, 71, 87, 0.5); }
            100% { transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 71, 87, 0.9); }
        }

        .match-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
        }

        .match-card {
            background: #12121a;
            border: 1px solid #2d2d3f;
            border-radius: 10px;
            padding: 12px;
        }
        .match-card.is-live { border-left: 4px solid var(--live-green); }

        .league-title {
            font-size: 0.75rem;
            color: #8888a0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .status-badge.live { background: rgba(46, 213, 115, 0.2); color: var(--live-green); border: 1px solid var(--live-green); }
        .status-badge.upcoming { background: rgba(243, 186, 47, 0.2); color: var(--gold-primary); }

        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            text-align: center;
        }

        .team {
            font-weight: bold;
            font-size: 0.85rem;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .team.home { text-align: right; }
        .team.away { text-align: left; }

        .score-box {
            background: #000;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            font-size: 0.95rem;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
            min-width: 65px;
            text-align: center;
        }

        .pick-info {
            margin-top: 10px;
            background: rgba(243, 186, 47, 0.08);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            font-size: 0.75rem;
            color: #ffd56b;
            font-weight: bold;
        }

        .sidebar-btn {
            display: block;
            background: var(--gold-gradient);
            color: #000;
            text-align: center;
            padding: 14px;
            border-radius: 10px;
            font-weight: 900;
            text-decoration: none;
            font-size: 1.05rem;
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.4);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-4px); }
            60% { transform: translateY(-2px); }
        }

        .seo-keywords { background: #14141c; border: 1px solid #2a2a3a; padding: 18px; border-radius: 8px; color: var(--text-dim); font-size: 0.85rem; margin-top: 25px; grid-column: 1 / -1; }
        footer { text-align: center; color: var(--text-dim); font-size: 0.85rem; margin-top: 30px; border-top: 1px solid #2a2a3a; padding-top: 20px; grid-column: 1 / -1; }
    </style>
</head>
