    <meta name="description" content="카지노, 라이브스코어, 바카라, 홀덤, 스포츠픽, 꽁머니 보증 업체 및 레버스 이벤트 배너 모음">
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #1a1a24;
            --gold-primary: #f3ba2f;
            --gold-gradient: linear-gradient(135deg, #ffe082 0%, #f3ba2f 100%);
            --text-color: #ffffff;
            --text-dim: #a0a0b0;
            --accent-red: #ff4757;
            --live-green: #2ed573;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding-bottom: 50px; }

        header {
            background: #14141c; border-bottom: 1px solid #2a2a3a;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.3rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-header { background: var(--gold-gradient); color: #000; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .hero-banner {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1639762681485-074b7f938ba0?auto=format&fit=crop&w=1000&q=80');
            background-size: cover; background-position: center; border: 2px solid var(--gold-primary);
            border-radius: 12px; padding: 35px 20px; text-align: center; margin-bottom: 25px;
        }
        .hero-badge { display: inline-block; background: var(--accent-red); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 12px; }
        .hero-title { font-size: 1.8rem; margin-bottom: 10px; }
        .hero-desc { color: var(--text-dim); margin-bottom: 20px; font-size: 1rem; }
        .btn-main { display: inline-block; background: var(--gold-gradient); color: #000; padding: 14px 30px; border-radius: 30px; font-size: 1.1rem; font-weight: 800; text-decoration: none; }

        .section-title { font-size: 1.2rem; margin: 25px 0 15px 0; border-left: 4px solid var(--gold-primary); padding-left: 10px; }

        .banner-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .banner-card { background: var(--card-bg); border: 1px solid #2a2a3a; border-radius: 10px; padding: 18px; text-decoration: none; color: white; display: flex; flex-direction: column; justify-content: space-between; }
        .banner-card:hover { border-color: var(--gold-primary); }
        .card-tag { color: var(--gold-primary); font-size: 0.8rem; font-weight: bold; margin-bottom: 6px; }
        .card-title { font-size: 1.05rem; font-weight: bold; margin-bottom: 6px; }
        .card-sub { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px; }
        .card-btn { background: #2a2a3a; text-align: center; padding: 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; color: var(--gold-primary); }

        /* 🔥 초화려한 실시간 라이브스코어 사이드바 디자인 */

            border-radius: 14px;
            padding: 18px;
            height: fit-content;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
