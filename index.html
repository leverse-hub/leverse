<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVERSE - 공식 파트너 및 배너 광고 센터</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0b0d12; 
            color: #ffffff; 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 215, 0, 0.15); 
        }
        .header-title h2 { color: #ffd700; font-size: 14px; letter-spacing: 2px; margin: 0 0 5px 0; }
        .header-title h1 { font-size: 28px; margin: 0; color: #ffffff; }
        .header-sub { color: #8a99ad; font-size: 13px; margin-top: 5px; }
        .banner-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 40px; }
        @media (max-width: 768px) { .banner-grid { grid-template-columns: 1fr; } }
        .banner-card { 
            background: #121722; border: 1px solid rgba(255, 215, 0, 0.2); 
            border-radius: 10px; overflow: hidden; text-decoration: none; display: block; transition: 0.2s; 
        }
        .banner-card:hover { transform: translateY(-4px); border-color: #ffd700; box-shadow: 0 6px 20px rgba(255, 215, 0, 0.15); }
        .banner-img { width: 100%; aspect-ratio: 1200 / 320; object-fit: cover; display: block; background: #1a2130; }
        .banner-footer { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; background: #161c2b; }
        .banner-title { color: #ffffff; font-weight: bold; font-size: 15px; }
        .badge { background: rgba(255, 215, 0, 0.1); color: #ffd700; border: 1px solid #ffd700; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .btn-contact { 
            background: linear-gradient(135deg, #e6c547, #b8860b); color: #111; 
            padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; 
            display: inline-flex; align-items: center; gap: 6px; 
        }
        .btn-contact:hover { background: linear-gradient(135deg, #ffd700, #daa520); }
        .ad-banner-box { 
            background: #121722; border: 1px solid rgba(255, 215, 0, 0.25); 
            border-radius: 10px; padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; margin-top: 30px; 
        }
        .ad-info h3 { color: #ffd700; margin: 0 0 5px 0; font-size: 16px; }
        .ad-info p { color: #8a99ad; margin: 0; font-size: 13px; }
        .footer-text { text-align: center; color: #556270; font-size: 12px; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <h2>LEVERSE OFFICIAL</h2>
                <h1>공식 파트너 및 배너 광고 센터</h1>
                <div class="header-sub">안전하고 검증된 제휴 파트너들의 프로모션과 실시간 링크를 안내해 드립니다.</div>
            </div>
            <a href="https://t.me/LEVERSE_1" target="_blank" class="btn-contact">📢 배너 광고 문의 →</a>
        </div>
        <div class="banner-grid" id="bannerContainer">
            <div style="grid-column: 1 / -1; text-align: center; color: #8a99ad; padding: 40px;">배너 목록을 불러오는 중...</div>
        </div>
        <div class="ad-banner-box">
            <div class="ad-info">
                <h3>📢 배너 광고 및 파트너 입점 문의</h3>
                <p>제휴 및 광고 등록을 원하시면 언제든 문의해 주세요. (권장 이미지: 1200 x 320px)</p>
            </div>
            <a href="https://t.me/LEVERSE_1" target="_blank" class="btn-contact">광고 문의하기 →</a>
        </div>
        <div class="footer-text">
            LEVERSE OFFICIAL | 제휴 및 파트너 광고 전용 공식 플랫폼입니다.<br>© 2026 LEVERSE. All rights reserved.
        </div>
    </div>
    <script>
        const MASTER_KEY = "$2a$10$z02BCvLiUiJxAdGwNLshJeQHmEmBK0dRsCnGRF.xsuMwIAFFqO2dW";
        const BIN_ID = "6af2586bffd5d16053b5085a";
        async function fetchBanners() {
            const container = document.getElementById('bannerContainer');
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
                const data = await res.json();
                let list = data.record ? (Array.isArray(data.record) ? data.record : (data.record.banners || [])) : [];
                renderBanners(list);
            } catch (e) {
                container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #e74c3c; padding: 40px;">배너 데이터를 불러오지 못했습니다.</div>';
            }
        }
        function renderBanners(banners) {
            const container = document.getElementById('bannerContainer');
            if (!banners || banners.length === 0) {
                container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #8a99ad; padding: 40px;">현재 등록된 배너가 없습니다.</div>';
                return;
            }
            let html = '';
            banners.forEach(b => {
                let link = b.linkUrl.trim();
                if (!link.startsWith('http://') && !link.startsWith('https://')) link = 'https://' + link;
                html += `<a href="${link}" target="_blank" class="banner-card">
                    <img src="${b.imageUrl}" alt="${b.title}" class="banner-img" onerror="this.src='https://via.placeholder.com/1200x320/1a2130/ffffff?text=Image+Load+Failed'">
                    <div class="banner-footer"><span class="banner-title">${b.title}</span><span class="badge">공식 파트너</span></div>
                </a>`;
            });
            container.innerHTML = html;
        }
        window.addEventListener('DOMContentLoaded', fetchBanners);
    </script>
</body>
</html>
