<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVERSE - 공식 파트너 및 배너 광고 센터</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #08090c; 
            color: #ffffff; 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            margin: 0; 
            padding: 30px 20px; 
            min-height: 100vh;
        }
        .container { max-width: 1100px; margin: 0 auto; }

        /* GNB 최상단 바 */
        .gnb-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
        }
        .brand-logo-icon {
            width: 26px;
            height: 26px;
            border: 1px solid rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffd700;
            font-size: 13px;
        }

        /* 중앙 헤더 영역 */
        .hero-section {
            text-align: center;
            margin-bottom: 50px;
        }
        .hero-tag {
            color: #b8860b;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .hero-title {
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            margin: 0 0 12px 0;
            letter-spacing: -1px;
        }
        .hero-sub {
            color: #7a8b9e;
            font-size: 14px;
        }

        /* 배너 섹션 헤더 */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        .section-title {
            color: #8a99ad;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title::before {
            content: "•";
            color: #ffd700;
            font-size: 16px;
        }
        .section-sub {
            color: #556270;
            font-size: 11px;
        }

        /* 배너 그리드 (PC 2열, 모바일 1열) */
        .banner-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            margin-bottom: 50px; 
        }
        @media (max-width: 768px) {
            .banner-grid { grid-template-columns: 1fr; }
        }

        /* 배너 카드 (레퍼런스 이미지 스타일) */
        .banner-card { 
            background: #11151e; 
            border: 1px solid rgba(255, 215, 0, 0.2); 
            border-radius: 12px; 
            overflow: hidden; 
            display: block;
            text-decoration: none;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .banner-card:hover { 
            transform: translateY(-4px); 
            border-color: #ffd700; 
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.15);
        }
        .banner-img { 
            width: 100%; 
            height: auto; 
            aspect-ratio: 1200 / 320; 
            object-fit: cover; 
            display: block; 
            background: #181f2c;
        }

        /* 하단 문의 박스 */
        .ad-banner-box { 
            background: #0e121a; 
            border: 1px solid rgba(255, 215, 0, 0.2); 
            border-radius: 12px; 
            padding: 25px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .ad-info-tag {
            color: #b8860b;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .ad-info h3 { color: #ffffff; margin: 0 0 8px 0; font-size: 20px; }
        .ad-info p { color: #6c7c90; margin: 0; font-size: 13px; line-height: 1.5; }

        /* 버튼 스타일 */
        .btn-contact { 
            background: linear-gradient(135deg, #e6c547, #b8860b); 
            color: #111; 
            padding: 10px 20px; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 13px; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-contact:hover { 
            background: linear-gradient(135deg, #ffd700, #daa520); 
        }

        .footer-text {
            text-align: center;
            color: #404b57;
            font-size: 11px;
            margin-top: 5px;
            line-height: 1.6;
        }
    </style>
</head>
