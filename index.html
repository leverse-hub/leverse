<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVERSE - 공식 파트너 및 배너 센터</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0b0d12; 
            color: #ffffff; 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .header { 
            text-align: center; 
            margin-bottom: 40px; 
            border-bottom: 1px solid rgba(255, 215, 0, 0.2); 
            padding-bottom: 30px; 
        }
        .brand { color: #ffd700; font-size: 14px; font-weight: bold; margin-bottom: 8px; letter-spacing: 2px; }
        h1 { color: #ffffff; font-size: 26px; margin: 0 0 12px 0; font-weight: bold; }
        .subtitle { color: #8a99ad; font-size: 14px; line-height: 1.5; }

        .banner-container { display: flex; flex-direction: column; gap: 20px; margin-bottom: 35px; }
        
        .banner-card { 
            background: #121722; 
            border: 1px solid rgba(255, 215, 0, 0.3); 
            border-radius: 8px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
        .banner-card:hover { 
            transform: translateY(-3px); 
            border-color: #ffd700; 
        }
        .banner-card img { width: 100%; height: auto; display: block; max-height: 320px; object-fit: cover; }
        .banner-info { padding: 15px 20px; background: #0f131c; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,215,0,0.1); }
        .banner-title { font-size: 16px; font-weight: bold; color: #ffd700; margin: 0; }
        .banner-badge { font-size: 12px; background: rgba(255, 215, 0, 0.1); color: #ffd700; padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(255, 215, 0, 0.2); }

        .info-card {
            background: #121722;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .info-card h4 { color: #ffd700; margin: 0 0 5px 0; font-size: 15px; }
        .info-card p { color: #8a99ad; margin: 0; font-size: 13px; }
        
        .btn-inquiry {
            background: linear-gradient(135deg, #e6c547, #b8860b);
            color: #111;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-inquiry:hover { background: linear-gradient(135deg, #ffd700, #daa520); }

        .footer { text-align: center; color: #556275; font-size: 12px; line-height: 1.5; }
        .no-banner { color: #8a99ad; padding: 40px; text-align: center; background: #121722; border-radius: 8px; border: 1px dashed rgba(255,215,0,0.2); font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">LEVERSE OFFICIAL</div>
            <h1>공식 파트너 및 배너 광고 센터</h1>
            <div class="subtitle">안전하고 검증된 제휴 파트너들의 프로모션과 실시간 링크를 안내해 드립니다.</div>
        </div>

        <div class="banner-container" id="mainBannerList">
            <div class="no-banner">배너를 불러오는 중입니다...</div>
        </div>

        <div class="info-card">
            <div>
                <h4>📢 배너 광고 및 파트너 입점 문의</h4>
                <p>제휴 및 광고 등록을 원하시면 언제든 문의해 주세요. (권장 이미지: 1200 x 320px)</p>
            </div>
            <a href="https://t.me/" target="_blank" class="btn-inquiry">광고 문의하기 →</a>
        </div>

        <div class="footer">
            LEVERSE OFFICIAL | 제휴 및 파트너 광고 전용 공식 플랫폼입니다.<br>
            © 2026 LEVERSE. All rights reserved.
        </div>
    </div>

    <script>
        const MASTER_KEY = "$2a$10$z02BCvLiUiJxAdGwNLshJeQHmEmBK0dRsCnGRF.xsuMwIAFFqO2dW";
        const BIN_ID = "6af2586bffd5d16053b5085a";

        async function loadMainBanners() {
            const container = document.getElementById('mainBannerList');
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                const banners = data.record || [];

                if (banners.length === 0) {
                    container.innerHTML = '<div class="no-banner">현재 등록된 배너가 없습니다.</div>';
                    return;
                }

                let html = '';
                banners.forEach(b => {
                    html += `
                        <div class="banner-card" onclick="window.open('${b.linkUrl}', '_blank')">
                            <img src="${b.imageUrl}" alt="${b.title}" onerror="this.src='https://via.placeholder.com/1200x320?text=Image+Load+Error'">
                            <div class="banner-info">
                                <h3 class="banner-title">${b.title}</h3>
                                <span class="banner-badge">공식 파트너</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div class="no-banner">배너를 불러오지 못했습니다.</div>';
            }
        }

        loadMainBanners();
    </script>
</body>
</html>
