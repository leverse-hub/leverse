<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="Ti1RlbPxQ7-tNZhRJ2KFkGqSk_nZOqBMrZ5p7f2YqFw" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVERSE OFFICIAL - 프리미엄 파트너 배너 네트워크</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0b0d12; 
            color: #ffffff; 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            margin: 0; 
            padding: 25px 20px; 
            background-image: radial-gradient(circle at 50% 15%, #182030 0%, #0b0d12 65%);
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* 상단 네비게이션 */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(18, 22, 31, 0.9); 
            backdrop-filter: blur(10px);
            padding: 16px 30px; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 215, 0, 0.2); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 45px; 
        }
        .logo { 
            color: #ffd700; 
            font-weight: 900; 
            font-size: 20px; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-ad-top { 
            background: linear-gradient(135deg, #e6c547, #b8860b); 
            color: #111; 
            padding: 10px 22px; 
            border-radius: 5px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 13px; 
            box-shadow: 0 0 15px rgba(218, 165, 32, 0.3);
            transition: all 0.3s ease; 
        }
        .btn-ad-top:hover { 
            background: linear-gradient(135deg, #ffd700, #daa520);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }

        /* 메인 타이틀 섹션 */
        .hero-section { text-align: center; margin: 20px 0 45px; }
        .hero-category { 
            color: #d4af37; 
            font-size: 12px; 
            letter-spacing: 3px; 
            font-weight: bold; 
            margin-bottom: 12px; 
        }
        .hero-title { 
            font-size: 36px; 
            font-weight: 900; 
            color: #ffffff; 
            margin: 0 0 12px; 
            letter-spacing: -1px;
        }
        .hero-desc { color: #8a99ad; font-size: 14px; }
        
        /* 섹션 구분 바 */
        .section-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 18px; 
            padding: 0 5px;
        }
        .section-title { font-size: 14px; color: #ffd700; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .section-desc { font-size: 12px; color: #7f8c8d; }

        /* 배너 그리드 */
        .banner-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 22px; 
            margin-bottom: 35px; 
        }
        .banner-slot { 
            background: #121722; 
            border: 1px solid rgba(255, 215, 0, 0.25); 
            border-radius: 8px; 
            overflow: hidden; 
            min-height: 180px; 
            position: relative;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
        }
        .banner-slot:hover { 
            border-color: #ffd700; 
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.25);
            transform: translateY(-3px);
        }
        .banner-slot a { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            height: 100%; 
            min-height: 180px;
            text-decoration: none; 
            color: #ffd700; 
            font-weight: bold; 
            font-size: 16px; 
            text-align: center; 
            padding: 20px; 
            gap: 8px;
        }
        .banner-slot span { color: #8a99ad; font-size: 12px; font-weight: normal; }
        .banner-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* 광고주 모집 박스 */
        .recruitment-box { 
            background: #121722; 
            border: 1px solid rgba(255, 215, 0, 0.2); 
            border-radius: 8px; 
            padding: 25px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 60px; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }
        .recruitment-info h4 { color: #ffd700; margin: 0 0 6px; font-size: 15px; }
        .recruitment-info p { color: #8a99ad; margin: 0; font-size: 13px; line-height: 1.5; }
        
        .btn-apply { 
            background: linear-gradient(135deg, #e6c547, #b8860b); 
            color: #111; 
            padding: 12px 24px; 
            border-radius: 5px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 13px; 
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(218, 165, 32, 0.3);
            transition: all 0.3s;
        }
        .btn-apply:hover { 
            background: linear-gradient(135deg, #ffd700, #daa520);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }

        /* 푸터 */
        .footer { 
            text-align: center; 
            padding-top: 25px; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
            color: #7f8c8d; 
            font-size: 12px; 
            line-height: 1.7; 
        }

        @media (max-width: 768px) {
            .banner-grid { grid-template-columns: 1fr; }
            .recruitment-box { flex-direction: column; gap: 20px; text-align: center; }
            .hero-title { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 상단 헤더 -->
        <div class="header">
            <div class="logo">👑 LEVERSE OFFICIAL</div>
            <a href="https://t.me/LEVERSE_1" target="_blank" class="btn-ad-top">배너 광고 문의</a>
        </div>

        <!-- 메인 타이틀 -->
        <div class="hero-section">
            <div class="hero-category">PREMIUM PARTNER BANNER</div>
            <div class="hero-title">실시간 글로벌 파트너 & 배너 안내</div>
            <div class="hero-desc">검증된 프리미엄 파트너 배너 광고를 등록하세요. 접속할 때마다 최적의 순서로 노출됩니다.</div>
        </div>
