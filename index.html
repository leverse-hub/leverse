<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVERSE OFFICIAL - 메이저 카지노 & 슬롯 공식 파트너 센터</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #06080c; color: #ffffff; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            margin: 0; padding: 25px 20px; min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(14, 18, 27, 0.85); padding: 16px 30px; border-radius: 12px; 
            border: 1px solid rgba(255, 215, 0, 0.4); margin-bottom: 45px; 
        }
        .logo { color: #ffd700; font-weight: 900; font-size: 22px; text-decoration: none; }
        .btn-ad-top { 
            background: linear-gradient(135deg, #fff3a1 0%, #ffd700 50%, #996515 100%); 
            color: #000; padding: 11px 24px; border-radius: 6px; text-decoration: none; font-weight: 900; font-size: 13px; 
        }
        .hero-section { text-align: center; margin: 30px 0 55px; }
        .hero-title { font-size: 42px; font-weight: 900; margin: 0 0 18px; color: #ffd700; }
        .hero-desc { color: #94a3b8; font-size: 15px; }
        .section-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-title { font-size: 14px; color: #ffd700; font-weight: 900; }
        .banner-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 40px; }
        .banner-slot { 
            background: #0f141d; border: 1px solid rgba(255, 215, 0, 0.3); 
            border-radius: 12px; overflow: hidden; min-height: 185px; position: relative; 
        }
        .banner-slot a { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; min-height: 185px; text-decoration: none; color: #ffd700; font-weight: bold; padding: 20px; gap: 8px; }
        .banner-slot span { color: #64748b; font-size: 12px; }
        .banner-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .footer { text-align: center; padding-top: 30px; border-top: 1px solid rgba(255, 255, 255, 0.08); color: #475569; font-size: 12px; }
        @media (max-width: 768px) { .banner-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./" class="logo">👑 LEVERSE OFFICIAL</a>
            <a href="https://t.me/LEVERSE_1" target="_blank" class="btn-ad-top">배너 광고 문의</a>
        </div>

        <div class="hero-section">
            <div class="hero-title">메이저 카지노 & 슬롯 공식 파트너 센터</div>
            <div class="hero-desc">검증된 최고급 카지노 파트너 배너 라운지입니다.</div>
        </div>

        <div class="section-bar">
            <div class="section-title">◆ PREFERRED PARTNERS</div>
        </div>

        <div class="banner-grid" id="bannerContainer"></div>

        <div class="footer">
            LEVERSE OFFICIAL © 2026. All rights reserved.
        </div>
    </div>

    <script>
        async function loadBanners() {
            try {
                // 캐시 방지를 위해 현재 시간값 부착
                const res = await fetch('./banners.json?t=' + Date.now());
                const data = await res.json();
                let banners = Array.isArray(data) ? data : (data.banners || []);
                renderBanners(banners);
            } catch (e) {
                renderBanners([]);
            }
        }

        function renderBanners(banners) {
            const container = document.getElementById('bannerContainer');
            if (!container) return;
            let html = '';

            if (banners && banners.length > 0) {
                // 무작위 셔플 로직 유지
                for (let i = banners.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [banners[i], banners[j]] = [banners[j], banners[i]];
                }

                banners.forEach(b => {
                    let link = (b.linkUrl || '#').trim();
                    if (link && !link.startsWith('http://') && !link.startsWith('https://')) {
                        link = 'https://' + link;
                    }
                    html += `
                        <div class="banner-slot">
                            <a href="${link}" target="_blank" style="padding:0;">
                                <img src="${b.imageUrl}" alt="${b.title || '배너'}" class="banner-img">
                            </a>
                        </div>
                    `;
                });
            }

            // 빈 슬롯 처리
            const currentCount = banners ? banners.length : 0;
            for (let i = currentCount; i < 2; i++) {
                html += `
                    <div class="banner-slot">
                        <a href="https://t.me/LEVERSE_1" target="_blank">
                            광고주 ${i + 1}번 프리미엄 골드 배너 (입점 문의)
                            <span>클릭하여 텔레그램 공식 채널로 문의하세요</span>
                        </a>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        loadBanners();
    </script>
</body>
</html>
